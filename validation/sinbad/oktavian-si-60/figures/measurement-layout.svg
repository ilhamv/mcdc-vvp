  <text x="410" y="185" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#173f5f">Polyethylene–iron</text>
  <text x="410" y="204" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#173f5f">pre-collimator</text>
