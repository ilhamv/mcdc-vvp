# Walltime is required for every case/mode job, in hours.
# Migration basis: previous 0.6-hour base multiplied by each former case/mode factor.
# Values are provisional carry-forwards; recalibration is pending.
# Calibration comments should record platform/resources, workload, measured time,
# and margin. A launch --walltime overrides all job requests uniformly.

# =============================================================================
# MC/DC Verification Task Definitions
# =============================================================================
#
# This file defines the fixed-source analytical multigroup verification cases.
#
# Each top-level key corresponds to a case directory under this suite, for
# example:
#
#     azurv1  ->  fixed_source/cases/azurv1/
#
# Parameters
# ----------
# logN_min : int
#     Base-10 logarithm of the minimum particle count.
#
# logN_max : int
#     Base-10 logarithm of the maximum particle count.
#
# N_task : int
#     Number of particle-count tasks between logN_min and logN_max, inclusive.
#     The particle counts are generated internally using:
#
#         numpy.logspace(logN_min, logN_max, N_task, dtype=int)
#
# Example
# -------
# logN_min: 5
# logN_max: 7
# N_task: 7
#
# generates:
#
#     100000
#     215443
#     464158
#     1000000
#     2154434
#     4641588
#     10000000
#
# =============================================================================

azurv1:
  logN_min: 5
  logN_max: 7
  N_task: 7
  walltime: 0.27

