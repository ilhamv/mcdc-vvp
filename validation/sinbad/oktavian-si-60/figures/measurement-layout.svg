  <text x="651" y="116" font-family="sans-serif" font-size="14" fill="#555">12.7 cm diameter × 5.1 cm</text>
  <text x="651" y="138" font-family="sans-serif" font-size="14" fill="#555">TOF-derived spectrum</text>
  <rect x="690" y="254" width="286" height="186" rx="8" fill="#eef6fa" stroke="#7da8be"/>
  <text x="833" y="282" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#173f5f">Neutron validation chain</text>
  <text x="710" y="311" font-family="sans-serif" font-size="14" fill="#344">• Correlated energy-angle D-T source</text>
  <text x="710" y="338" font-family="sans-serif" font-size="14" fill="#344">• Target, Cu backing, tube and duct</text>
  <text x="710" y="365" font-family="sans-serif" font-size="14" fill="#344">• Collimator, housing and detector cells</text>
