# Walltime calibration: LLNL Dane, 20 full CPU nodes,
# 2240 MPI ranks total, Numba CPU execution; jobs submitted 2026-11-04.
# Source (repository root): status-verification-code_to_code-multigroup-fixed_source.csv
# Use Run Time (End Time - Start Time), excluding queue wait; all jobs have zero restarts.
# Each value covers the full case job and its configured sampling sequence.
# FINISHED jobs: walltime [h] = ceil(1.5 * Run Time [s] / 36) / 100.
# This rounds upward to 0.01 h; the scheduler then applies its time resolution.
# Recalibrate if sampling, physics inputs, execution mode, or resources change.
# A launch-level walltime overrides these requests uniformly; use None to retain them.

c5g7-4phase:
  logN_min: 5
  logN_max: 7
  N_task: 5
  # Job 8421526: TIMEDOUT after 24:07:03; completion time unknown.
  # 1.5x the observed lower bound is 36.18 h, above Dane's 24 h limit.
  # The 24 h request is the platform limit, not a calibrated 1.5x allowance.
  # Reduce the workload or obtain a longer-time allocation before recalibrating.
  walltime: 24

kobayashi:
  logN_min: 8
  logN_max: 10
  N_task: 5
  # Job 8421525: FINISHED; Run Time 02:06:21; 1.5x -> 3.16 h.
  walltime: 3.16

kobayashi-detector:
  logN_min: 7
  logN_max: 9
  N_task: 5
  # Job 8421524: FINISHED; Run Time 02:56:32; 1.5x -> 4.42 h.
  walltime: 4.42
