  <rect x="64" y="570" width="912" height="28" rx="5" fill="#fff4df" stroke="#d59b34"/>
  <text x="520" y="590" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7a4d00">The finite detector is modeled directly; production statistics require variance reduction and verified response processing.</text>
