# Walltime calibration: LLNL Dane, 1 full CPU node,
# 112 MPI ranks total, Numba CPU execution; jobs submitted 2026-11-04.
# Source (repository root): status-verification-analytical-multigroup-k_eigenvalue.csv
# Use Run Time (End Time - Start Time), excluding queue wait; all jobs have zero restarts.
# Each value covers the full case job and its configured sampling sequence.
# FINISHED jobs: walltime [h] = ceil(1.5 * Run Time [s] / 36) / 100.
# This rounds upward to 0.01 h; the scheduler then applies its time resolution.
# Recalibrate if sampling, physics inputs, execution mode, or resources change.
# A launch-level walltime overrides these requests uniformly; use None to retain them.

# =============================================================================
# MC/DC Verification Task Definitions
# =============================================================================
#
# This file defines the analytical multigroup k-eigenvalue cases.
#
# Each top-level key corresponds to a case directory under this suite.
# The active-cycle counts are generated with:
#
#     numpy.rint(
#         numpy.geomspace(N_active_min, N_active_max, N_task)
#     ).astype(int)
#
# The fixed particle and inactive-cycle counts are set in each input.py.
#
# =============================================================================

