<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640">
  <rect width="1040" height="640" fill="#ffffff"/>
  <text x="520" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#173f5f">Implemented MC/DC model: detector-explicit 3-D Si-60</text>
  <text x="520" y="67" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#555">Detailed neutron geometry with the NaI crystal from the supplied gamma model</text>

  <line x1="55" y1="350" x2="258" y2="350" stroke="#d1495b" stroke-width="4"/>
  <polygon points="270,350 250,339 250,361" fill="#d1495b"/>
  <text x="58" y="205" font-family="sans-serif" font-size="15" fill="#d1495b">250 keV deuteron beam</text>

  <circle cx="300" cy="350" r="122" fill="#59636e"/>
  <circle cx="300" cy="350" r="118" fill="#8ecae6"/>
  <circle cx="300" cy="350" r="41" fill="#59636e"/>
  <circle cx="300" cy="350" r="38" fill="#f5f8fa"/>
  <rect x="178" y="339" width="122" height="22" fill="#f5f8fa" stroke="#59636e" stroke-width="2"/>
  <rect x="287" y="344" width="13" height="12" fill="#c97b38" stroke="#173f5f" stroke-width="1"/>
  <rect x="297" y="344" width="3" height="12" fill="#d1495b"/>
  <text x="300" y="500" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#173f5f">Si pile and stainless-steel vessel</text>
  <text x="300" y="523" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">30.5 cm outer radius; 10 cm cavity; reentrant duct</text>
  <text x="300" y="545" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Ti-T target, Cu backing, and beam tube included</text>

  <line x1="300" y1="350" x2="756" y2="145" stroke="#173f5f" stroke-width="2.5" stroke-dasharray="8 6"/>
  <path d="M 380 350 A 80 80 0 0 0 360 314" fill="none" stroke="#173f5f" stroke-width="2"/>
  <text x="372" y="325" font-family="sans-serif" font-size="16" fill="#173f5f">55°</text>

  <g transform="rotate(-24 500 260)">
    <rect x="470" y="218" width="60" height="84" fill="#d0b271" stroke="#173f5f" stroke-width="2"/>
    <line x1="490" y1="218" x2="490" y2="302" stroke="#173f5f" stroke-width="1.5"/>
    <line x1="510" y1="218" x2="510" y2="302" stroke="#173f5f" stroke-width="1.5"/>
  </g>
  <text x="470" y="190" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#173f5f">Fe/paraffin pre-collimator</text>

  <polygon points="514,248 532,240 536,248 518,256" fill="#9ad8d0" stroke="#173f5f" stroke-width="2"/>
  <line x1="526" y1="232" x2="565" y2="165" stroke="#287d77" stroke-width="1.5"/>
  <text x="570" y="155" font-family="sans-serif" font-size="15" fill="#287d77">NaI gamma detector</text>
  <text x="570" y="174" font-family="sans-serif" font-size="13" fill="#555">7.62 cm diameter × 7.1 cm; 580–587.1 cm</text>

  <path d="M 535 252 L 655 180 L 676 205 L 553 278 Z" fill="#59636e" stroke="#173f5f" stroke-width="2"/>
  <path d="M 552 258 L 657 194 L 663 201 L 558 265 Z" fill="#ffffff"/>
  <rect x="570" y="178" width="92" height="116" fill="none" stroke="#a07842" stroke-width="8"/>
  <text x="600" y="325" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#173f5f">Iron/concrete main shielding</text>

  <g transform="rotate(-24 756 145)">
    <rect x="710" y="103" width="92" height="84" fill="#d9c49b" stroke="#173f5f" stroke-width="3"/>
    <rect x="720" y="113" width="72" height="64" fill="#8e8e8e" stroke="#173f5f" stroke-width="2"/>
    <rect x="741" y="119" width="30" height="52" rx="10" fill="#f2c14e" stroke="#173f5f" stroke-width="2"/>
  </g>
  <text x="806" y="102" font-family="sans-serif" font-size="16" fill="#173f5f">Finite NE-218 detector</text>
  <text x="806" y="125" font-family="sans-serif" font-size="14" fill="#555">12.7 cm diameter × 5.1 cm</text>
  <text x="806" y="147" font-family="sans-serif" font-size="14" fill="#555">center at 1097.45 cm</text>

  <rect x="690" y="245" width="304" height="226" rx="8" fill="#eef6fa" stroke="#7da8be"/>
  <text x="842" y="276" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#173f5f">Transport model contents</text>
  <text x="712" y="307" font-family="sans-serif" font-size="14" fill="#344">• 19 root cells in a 20 m air domain</text>
  <text x="712" y="336" font-family="sans-serif" font-size="14" fill="#344">• 11 benchmark material definitions</text>
  <text x="712" y="365" font-family="sans-serif" font-size="14" fill="#344">• Room-temperature data at 293.6 K</text>
  <text x="712" y="394" font-family="sans-serif" font-size="14" fill="#344">• 288-component energy-angle D-T source</text>
  <text x="712" y="423" font-family="sans-serif" font-size="14" fill="#344">• Detector-cell energy and TOF flux tallies</text>
  <text x="712" y="452" font-family="sans-serif" font-size="14" fill="#344">• Explicit collimator and detector housing</text>

  <rect x="62" y="579" width="916" height="40" rx="7" fill="#eaf6ef" stroke="#5b9f78"/>
  <text x="520" y="604" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#285c3d">Both detector crystals are explicit; photon production, photon transport, response processing, and convergence remain unavailable or unverified.</text>
</svg>
