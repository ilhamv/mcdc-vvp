# Walltime calibration: LLNL Dane, 1 full CPU node, 112 MPI ranks, Numba CPU.
# Source: analytical_multigroup_fixed_source.zip :: maestro_run_20261106-215958/status.csv
# Jobs submitted 2026-11-06; Run Time excludes queue wait and covers the full case job.
# Requests [h] = ceil(1.5 * observed Run Time [s] / 36) / 100, rounded upward to 0.01 h.
# FINISHED rows measure completed sequences. TIMEDOUT/FAILED rows are censored:
# their buffered times are provisional rerun allowances, not calibrated completion times.
# Recalibrate those cases after their complete sampling sequences finish.
# Recalibrate after changes to inputs, sampling, execution mode, resources, or MC/DC.
# A launch-level walltime overrides these values uniformly; use None to retain them.

# =============================================================================
# MC/DC Verification Task Definitions
# =============================================================================
#
# This file defines the fixed-source analytical multigroup verification cases.
#
# Each top-level key corresponds to a case directory under this suite, for
# example:
#
#     azurv1  ->  fixed_source/cases/azurv1/
#
# Parameters
# ----------
# logN_min : int
#     Base-10 logarithm of the minimum particle count.
#
# logN_max : int
#     Base-10 logarithm of the maximum particle count.
#
# N_task : int
#     Number of particle-count tasks between logN_min and logN_max, inclusive.
#     The particle counts are generated internally using:
#
#         numpy.logspace(logN_min, logN_max, N_task, dtype=int)
#
# Example
# -------
# logN_min: 5
# logN_max: 7
# N_task: 7
#
# generates:
#
#     100000
#     215443
#     464158
#     1000000
#     2154434
#     4641588
#     10000000
#
# =============================================================================

