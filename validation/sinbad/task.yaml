# =============================================================================
# MC/DC Validation Task Definitions
# =============================================================================
#
# This file defines the SINBAD validation cases.
#
# Each benchmark contains case keys corresponding to directories under this suite:
#
#     fng-tud-sic / p1  ->  sinbad/fng-tud-sic/p1/
#
# Parameters
# ----------
# N_particle : int
#     Number of source particles per batch.
#     The case's input.py sets the number of batches.
#
# N_node is the number of nodes per job.
# walltime is the requested time per job in hours.
# Calibrated values are provided as reference and default.
#
# Example
# -------
# fng-tud-sic:
#   p1:
#     N_particle: 1_000_000_000
#     N_node: 10
#     walltime: 0.24
#
# This runs the P1 case with one billion particles per batch.
#
# =============================================================================

oktavian-si-60:
  neutron_leakage:
    N_particle: 1_000_000_000
    # Calibration: Dane, [short commit tag, and date time]
    N_node: 10
    walltime: 8.16

fng-tud-sic:
  p1:
    N_particle: 1_000_000_000
    # Calibration: Dane, [short commit tag, and date time]
    N_node: 10
    walltime: 0.24
  p2:
    N_particle: 1_000_000_000
    # Calibration: Dane, [short commit tag, and date time]
    N_node: 10
    walltime: 0.21
  p3:
    N_particle: 1_000_000_000
    # Calibration: Dane, [short commit tag, and date time]
    N_node: 10
    walltime: 0.21
  p4:
    N_particle: 1_000_000_000
    # Calibration: Dane, [short commit tag, and date time]
    N_node: 10
    walltime: 0.21
