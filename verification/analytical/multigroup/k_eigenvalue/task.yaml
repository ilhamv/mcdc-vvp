# =============================================================================
# MC/DC Verification Task Definitions
# =============================================================================
#
# This file defines the analytical multigroup k-eigenvalue verification cases.
#
# Each top-level key corresponds to a case directory under this suite, for example:
#
#     one_group_slab  ->  k_eigenvalue/cases/one_group_slab/
#
# Each case's input.py sets the particles per cycle and the number of inactive cycles.
#
# Parameters
# ----------
# N_active_min : int
#     Minimum number of active cycles.
#
# N_active_max : int
#     Maximum number of active cycles.
#
# N_task : int
#     Number of active-cycle counts sampled between the two bounds, inclusive.
#
#         numpy.rint(numpy.geomspace(N_active_min, N_active_max, N_task)).astype(int)
#
# N_node is the number of nodes per job.
# walltime is the requested time per job in hours.
# Calibrated values are provided as reference and default.
#
# Example
# -------
# N_active_min: 20
# N_active_max: 2000
# N_task: 5
#
# Active cycles per run:
#
#     20
#     63
#     200
#     632
#     2000
#
# =============================================================================

one_group_slab:
  N_active_min: 20
  N_active_max: 2000
  N_task: 5
  # Calibration: Dane, [short commit tag, and date time]
  N_node: 1
