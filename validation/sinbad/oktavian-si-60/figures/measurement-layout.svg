  <text x="526" y="279" transform="rotate(-49 526 279)" font-family="sans-serif" font-size="15" fill="#173f5f">about 11 m source-to-detector</text>
  <rect x="474" y="204" width="58" height="82" fill="#c8a96b" stroke="#173f5f" stroke-width="2"/>
  <line x1="489" y1="204" x2="489" y2="286" stroke="#173f5f" stroke-width="2"/>
  <line x1="503" y1="204" x2="503" y2="286" stroke="#173f5f" stroke-width="2"/>
