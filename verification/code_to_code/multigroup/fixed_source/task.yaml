# =============================================================================
# MC/DC Verification Task Definitions
# =============================================================================
#
# This file defines the fixed-source code-to-code multigroup verification cases.
#
# Each top-level key corresponds to a case directory under this suite, for example:
#
#     c5g7-4phase  ->  fixed_source/cases/c5g7-4phase/
#
# Each sampling point uses the batch count defined in the case's input.py.
#
# Parameters
# ----------
# logN_min : int
#     Base-10 logarithm of the minimum number of particles per batch.
#
# logN_max : int
#     Base-10 logarithm of the maximum number of particles per batch.
#
# N_task : int
#     Number of particle counts sampled between the two bounds, inclusive.
#
#         numpy.logspace(logN_min, logN_max, N_task, dtype=int)
#
# N_node is the number of nodes per job.
# walltime is the requested time per job in hours.
# Calibrated values are provided as reference and default.
#
# Example
# -------
# logN_min: 5
# logN_max: 7
# N_task: 5
#
# Particles per batch:
#
#     100000
#     316227
#     1000000
#     3162277
#     10000000
#
# =============================================================================

c5g7-4phase:
  logN_min: 5
  logN_max: 7
  N_task: 5
  # Calibration: Dane, [short commit tag, and date time]
  N_node: 64
  walltime: 18.08

kobayashi:
  logN_min: 8
  logN_max: 10
  N_task: 5
  # Calibration: Dane, [short commit tag, and date time]
  N_node: 64
  walltime: 3.16

kobayashi-detector:
  logN_min: 7
  logN_max: 9
  N_task: 5
  # Calibration: Dane, [short commit tag, and date time]
  N_node: 64
  walltime: 2.96
